spring.application.name=MajiPoa

# Loads .env file as property source
spring.config.import=optional:file:.env[.properties]

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:majipoa;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Google OAuth2 — credentials from .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# After successful OAuth2 login, redirect to the Angular dev server
app.oauth2.redirect-uri=http://localhost:4200/auth/callback

# CORS — allowed Angular dev origin
app.cors.allowed-origins=http://localhost:4200
