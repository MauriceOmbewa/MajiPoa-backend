spring.application.name=MajiPoa

# Loads .env file as property source
spring.config.import=optional:file:.env[.properties]

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:majipoa;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Google OAuth2 — normal users
# Resolves to: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Google OAuth2 — admin portal (separate Google client)
# Fixed to match Google Console: http://localhost:8080/login/oauth2/code/google/admin
spring.security.oauth2.client.registration.google-admin.provider=google
spring.security.oauth2.client.registration.google-admin.client-name=Google Admin
spring.security.oauth2.client.registration.google-admin.client-id=${GOOGLE_ADMIN_CLIENT_ID}
spring.security.oauth2.client.registration.google-admin.client-secret=${GOOGLE_ADMIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.google-admin.scope=openid,profile,email
spring.security.oauth2.client.registration.google-admin.redirect-uri={baseUrl}/login/oauth2/code/google/admin
# Frontend redirects
app.oauth2.redirect-uri=http://localhost:4200/auth/callback
app.oauth2.failure-uri=http://localhost:4200/sign-in
app.oauth2.admin-verify-uri=http://localhost:4200/admin/verify
app.oauth2.admin-login-uri=http://localhost:4200/admin/login

# Admin gate
app.admin.password-hash=${ADMIN_PASSWORD_HASH}
app.admin.emails=${ADMIN_EMAILS}

# CORS — allowed Angular dev origin
app.cors.allowed-origins=http://localhost:4200